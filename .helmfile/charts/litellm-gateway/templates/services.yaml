{{- range $role := list "management" "data" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $role }}
  labels:
    {{- include "litellm-gateway.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
spec:
  type: ClusterIP
  selector:
    {{- include "litellm-gateway.selector" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - {name: http, port: {{ $.Values.service.port }}, targetPort: {{ $role }}}
{{- end }}
