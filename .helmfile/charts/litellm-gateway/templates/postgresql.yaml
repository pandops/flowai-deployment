apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "litellm-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  selector:
    {{- include "litellm-gateway.selector" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - {name: postgresql, port: 5432, targetPort: postgresql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  labels:
    {{- include "litellm-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      {{- include "litellm-gateway.selector" . | nindent 6 }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        {{- include "litellm-gateway.selector" . | nindent 8 }}
        app.kubernetes.io/component: postgresql
    spec:
      automountServiceAccountToken: false
      {{- if eq .Values.storageMode "adopt" }}
      initContainers:
        - name: existing-database
          image: {{ .Values.postgresql.image }}
          command: [sh, -ec, 'test "$(cat /data/pgdata/PG_VERSION)" = 16']
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ .Values.postgresql.image }}
          ports:
            - {name: postgresql, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/secrets/postgresql/password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: password, mountPath: /run/secrets/postgresql, readOnly: true}
          readinessProbe:
            exec: {command: [pg_isready, --host, 127.0.0.1, -U, {{ .Values.postgresql.username | quote }}, -d, {{ .Values.postgresql.database | quote }}]}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: password
          secret:
            secretName: {{ required "LiteLLM PostgreSQL Secret reference is required" .Values.auth.databaseSecret | quote }}
            items:
              - {key: postgres-password, path: password}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgresql.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
