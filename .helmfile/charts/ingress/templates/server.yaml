{{- $config := tpl (.Files.Get "files/stand.conf.gotmpl") . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress
data:
  stand.conf: |
{{ $config | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress
spec:
  replicas: 1
  selector:
    matchLabels: {app: ingress}
  template:
    metadata:
      labels: {app: ingress}
      annotations:
        checksum/config: {{ $config | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine
          ports: [{name: https, containerPort: 8443}]
          readinessProbe:
            tcpSocket: {port: https}
            periodSeconds: 2
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tls, mountPath: /run/tls, readOnly: true}
      volumes:
        - name: conf
          configMap: {name: ingress}
        - name: tls
          secret:
            secretName: {{ required "ingress TLS Secret reference is required" .Values.tls.name | quote }}
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
---
apiVersion: v1
kind: Service
metadata:
  name: ingress
spec:
  selector: {app: ingress}
  ports: [{port: 8443}]
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-host
spec:
  type: NodePort
  selector: {app: ingress}
  ports:
    - port: 8443
      {{- with .Values.nodePort }}
      nodePort: {{ . }}
      {{- end }}
