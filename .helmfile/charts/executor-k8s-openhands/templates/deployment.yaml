{{- $image := required "image.reference must come from the verified candidate" .Values.image.reference }}
{{- if or (not (regexMatch "^[^@[:space:]]+/[^/@:[:space:]]+:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$" $image)) (hasSuffix ":latest" (lower $image)) }}
{{- fail "Executor image requires an explicit version tag" }}
{{- end }}
{{- $configPath := printf "%s/config/config.yaml" .Values.executor.dataDir }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: executor-k8s-openhands
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: executor-k8s-openhands
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor-k8s-openhands
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # A new broker.token (helm upgrade) or configuration restarts the Pod.
        checksum/config: {{ include (print $.Template.BasePath "/config-secret.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ .Release.Name }}
      # The drain after SIGTERM plus 30 s for deleting Pods and the final events.
      terminationGracePeriodSeconds: {{ add (int .Values.executor.drainTimeoutSeconds) 30 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Copies the rendered configuration onto the writable volume with mode 0600.
        - name: install-config
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["install-config", "--from", "/etc/flowai/rendered/config.yaml", "--to", {{ $configPath | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: rendered-config
              mountPath: /etc/flowai/rendered
              readOnly: true
            - name: data
              mountPath: {{ .Values.executor.dataDir }}
      containers:
        - name: executor
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", {{ $configPath | quote }}]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: {{ .Values.executor.dataDir }}
            - name: stand-ca
              mountPath: /run/flowai/stand-ca
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-cache
        - name: rendered-config
          secret:
            secretName: {{ .Release.Name }}-config
            defaultMode: 0440
        - name: stand-ca
          secret:
            secretName: {{ .Values.broker.caSecret }}
            items:
              - key: {{ .Values.broker.caKey }}
                path: {{ .Values.broker.caKey }}
