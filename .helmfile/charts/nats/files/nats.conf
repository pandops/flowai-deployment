server_name: flowai-nats
port: 4222
http_port: 8222
max_payload: 2097152
tls {
  cert_file: "/run/tls/tls.crt"
  key_file: "/run/tls/tls.key"
  timeout: 5
}
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 64MB
  max_file_store: 4GB
}
operator: "/etc/nats/operator.jwt"
resolver {
  type: full
  dir: "/data/resolver"
  allow_delete: false
  interval: "2m"
  timeout: "5s"
}
