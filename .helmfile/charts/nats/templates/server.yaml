{{- $refs := .Values.natsBootstrap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: {{ .Release.Namespace }}
data:
  nats.conf: |
{{ .Files.Get "files/nats.conf" | indent 4 }}
  resolver.sh: |
{{ .Files.Get "files/resolver.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
      annotations:
        flowai.io/config: {{ printf "%s%s" (.Files.Get "files/nats.conf") (.Files.Get "files/resolver.sh") | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: require-resolver
          image: {{ .Values.image }}
          command: ["/bin/sh", "-ec"]
          args: ['if ! /bin/sh /etc/resolver/resolver.sh "$1" >/dev/null 2>&1; then echo "NATS resolver continuity check failed" >&2; exit 1; fi', "--", {{ .Values.storageMode | quote }}]
          volumeMounts:
            - name: data
              mountPath: /data
              {{- if eq .Values.storageMode "adopt" }}
              readOnly: true
              {{- end }}
            - {name: resolver-check, mountPath: /etc/resolver, readOnly: true}
            - {name: resolver-identities, mountPath: /run/resolver-identities, readOnly: true}
            {{- if eq .Values.storageMode "fresh" }}
            - {name: resolver-seed, mountPath: /run/resolver-seed, readOnly: true}
            {{- end }}
      containers:
        - name: nats
          image: {{ .Values.image }}
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: 8222
            periodSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/nats, readOnly: true}
            - {name: tls, mountPath: /run/tls, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: nats-config
                  items:
                    - {key: nats.conf, path: nats.conf}
              - secret:
                  name: {{ required "natsBootstrap.operator" ($refs.operator | default dict).name | quote }}
                  items:
                    - {key: operator.jwt, path: operator.jwt}
        - name: resolver-check
          configMap:
            name: nats-config
            items:
              - {key: resolver.sh, path: resolver.sh}
        - name: resolver-identities
          secret:
            secretName: {{ required "natsBootstrap.resolverIdentities" ($refs.resolverIdentities | default dict).name | quote }}
            items:
              - {key: application-account, path: application-account}
              - {key: system-account, path: system-account}
        {{- if eq .Values.storageMode "fresh" }}
        - name: resolver-seed
          secret:
            secretName: {{ required "natsBootstrap.resolverSeed" ($refs.resolverSeed | default dict).name | quote }}
            items:
              - {key: application.jwt, path: application.jwt}
              - {key: system.jwt, path: system.jwt}
        {{- end }}
        - name: tls
          secret:
            secretName: {{ required "natsTLS" .Values.tls.name | quote }}
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        - name: data
          persistentVolumeClaim:
            claimName: nats
