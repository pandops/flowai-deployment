apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-bootstrap
  namespace: {{ .Release.Namespace }}
data:
{{ (.Files.Glob "files/contracts/*.json").AsConfig | indent 2 }}
  bootstrap.sh: |
{{ .Files.Get "files/bootstrap.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-bootstrap
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 240
  backoffLimit: 2
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrapImage }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if ! /bin/sh /etc/bootstrap/bootstrap.sh >/dev/null 2>&1; then
                echo 'NATS stream and consumer bootstrap failed' >&2
                exit 1
              fi
          volumeMounts:
            - {name: files, mountPath: /etc/bootstrap, readOnly: true}
            - {name: creds, mountPath: /run/bootstrap, readOnly: true}
            - {name: stand-ca, mountPath: /run/flowai/stand-ca, readOnly: true}
      volumes:
        - name: files
          configMap:
            name: nats-bootstrap
        - name: creds
          secret:
            secretName: {{ required "natsBootstrap.credentials" (.Values.natsBootstrap.credentials | default dict).name | quote }}
            items:
              - {key: user.creds, path: user.creds}
        - name: stand-ca
          secret:
            secretName: {{ required "standCA" .Values.standCA.name | quote }}
            items:
              - {key: ca.pem, path: ca.pem}
