name: Qualify deployment foundation
on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full commit SHA of the deployment foundation
        required: true
        type: string
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify selected source revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify bootstrap inputs
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          test -f scripts/preflight.py
          test -f .helmfile/platform-workloads.json
      - name: Install pinned Helm tooling
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/flowai-helm-tools"
          cd "$RUNNER_TEMP/flowai-helm-tools"
          curl --fail --silent --show-error --location --proto '=https' \
            --output helm.tar.gz https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --proto '=https' \
            --output helmfile.tar.gz \
            https://github.com/helmfile/helmfile/releases/download/v1.4.4/helmfile_1.4.4_linux_amd64.tar.gz
          sha256sum --check <<'CHECKSUMS'
          70b2c30a19da4db264dfd68c8a3664e05093a361cefd89572ffb36f8abfa3d09  helm.tar.gz
          3c35a7d7f65e900fa770cc27c119b1f48d458cd5755b4103e679ba5eb029ec91  helmfile.tar.gz
          CHECKSUMS
          tar -xzf helm.tar.gz linux-amd64/helm
          tar -xzf helmfile.tar.gz helmfile
          mv linux-amd64/helm .
          printf '%s\n' "$PWD" >> "$GITHUB_PATH"
      - name: Lint and render with synthetic references
        run: |
          python3 -B - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          import sys

          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from preflight import (DATABASE_ROLE_KEYS, GATEWAY_ENV_KEYS, NATS_BOOTSTRAP_KEYS,
                                 ROOT, TLS_REFS, protected_refs, runtime_target)


          def run(args, env):
              result = subprocess.run(args, cwd=ROOT, env=env, capture_output=True, check=False)
              if result.returncode:
                  sys.stderr.buffer.write(result.stderr)
                  raise SystemExit(f"{args[0]} {args[-1]} failed")
              return result.stdout.decode()


          def main():
              namespace = "foundation-preview-dev"
              target = {
                  "schema": 1,
                  "worktree": "foundation-preview",
                  "namespace": namespace,
                  "phase": "test",
                  "lanAddress": "192.0.2.44",
                  "worktreePort": 59000,
                  "origin": "https://192.0.2.44:59000",
              }
              tls = {
                  name: {"kind": kind, "name": f"preview-{name.lower()}", "keys": keys}
                  for name, (kind, *keys) in TLS_REFS.items()
              }
              runtime_target(target, target)
              protected_refs({"schema": 1, "namespace": namespace, "tls": tls}, namespace)
              with tempfile.TemporaryDirectory(dir="/dev/shm") as directory:
                  env = {
                      "PATH": os.environ["PATH"],
                      "HOME": directory,
                      "TMPDIR": directory,
                      "KUBECONFIG": "/dev/null",
                      "HELMFILE_DISABLE_INSECURE_FEATURES": "true",
                      "HELMFILE_UPGRADE_NOTICE_DISABLED": "1",
                  }
                  helm = run(["helm", "version", "--short"], env).strip().split("+", 1)[0]
                  helmfile = run(["helmfile", "version", "--output", "short"], env).strip()
                  if helm != "v4.1.4" or helmfile != "1.4.4":
                      raise SystemExit("Static qualification requires Helm 4.1.4 and Helmfile 1.4.4")
                  state = Path(directory, "foundation.json")
                  state.write_text(json.dumps({
                      "foundation": {"namespace": namespace, "origin": target["origin"], "tls": tls}
                  }))
                  state.chmod(0o600)
                  command = [
                      "helmfile", "--file", ".helmfile/foundation.helmfile.yaml.gotmpl",
                      "--skip-deps", "--state-values-file", str(state),
                  ]
                  run([*command, "lint"], env)
                  rendered = run([*command, "template"], env)
                  lines = (line for line in rendered.splitlines() if not line.startswith("#") and line != "---")
                  document = json.loads("\n".join(lines))
                  expected = {
                      "apiVersion": "v1",
                      "kind": "ConfigMap",
                      "metadata": {"name": "flowai-foundation", "namespace": namespace},
                      "data": {
                          "origin": target["origin"],
                          "tlsReferences": json.dumps(tls, separators=(",", ":"), sort_keys=True),
                      },
                  }
                  if document != expected:
                      raise SystemExit("Foundation render differs from the reference contract")
                  verify_platform(Path(directory), env, target, tls)
              print("Foundation and twelve platform workloads passed static qualification.")


          def verify_platform(directory, env, target, tls):
              fixture = "1.2.3"

              def private_json(name, document):
                  path = directory / name
                  path.write_text(json.dumps(document))
                  path.chmod(0o600)
                  return str(path)

              def ref(name, keys):
                  return {"kind": "Secret", "name": name, "keys": keys}

              catalog = json.loads((ROOT / ".helmfile/platform-workloads.json").read_text())
              names = {
                  "source-controller", "task-manager", "journal", "audit", "team-registry",
                  "flow-registry", "model-registry", "env-registry", "executor-registry",
                  "admin-panel", "api-gateway", "web-ui",
              }
              if set(catalog) != names:
                  raise SystemExit("Unexpected platform workload definitions")
              services = {}
              for name, definition in catalog.items():
                  if name == "web-ui":
                      continue
                  services[name] = {
                      "config": (ref("api-gateway-env", GATEWAY_ENV_KEYS)
                                 if name == "api-gateway" else ref(f"{name}-config", ["config.yaml"])),
                      "nats": ref(f"{name}-nats", ["user.creds"]),
                      "revision": "synthetic-input-1",
                  }
                  if "extra" in definition:
                      extra = definition["extra"]
                      services[name]["extra"] = ref(extra["name"], extra["keys"])
              protected = {
                  "schema": 1, "namespace": target["namespace"], "tls": tls,
                  "sharedPlatform": {
                      "platformDatabaseAdmin": {"secretName": "preview-postgres", "secretKey": "postgres-password"},
                      "serviceDatabaseRole": ref("preview-roles", DATABASE_ROLE_KEYS),
                      "natsBootstrap": {
                          name: ref(f"preview-{name.lower()}", keys)
                          for name, keys in NATS_BOOTSTRAP_KEYS.items() if name != "resolverSeed"
                      },
                  },
                  "identityRouting": {
                      "liteLLMGatewayAuth": ref("litellm-gateway-auth",
                                               ["master-key", "credential-encryption-key", "database-url"]),
                      "liteLLMDatabase": ref("preview-litellm-db", ["postgres-password"]),
                      "keycloakReconcile": ref("preview-keycloak-admin", ["username", "password"]),
                  },
                  "platformWorkloads": {"fixtureHostAddress": "192.0.2.55", "services": services},
              }
              inventory = {
                  "namespace": target["namespace"],
                  "ingressNodePort": 31443,
                  "liteLLMImage": f"registry.invalid/preview/litellm:{fixture}",
                  "keycloakImage": f"registry.invalid/preview/keycloak:{fixture}",
                  "workloadImages": {name: f"registry.invalid/preview/{name}:{fixture}" for name in names},
              }
              target_file = private_json("target.json", target)
              values = str(directory / "platform.json")
              run([
                  "python3", "-B", "scripts/preflight.py",
                  "--runtime-target", target_file, "--owned-target", target_file,
                  "--shared-platform-storage", "adopt",
                  "--protected-refs", private_json("protected.json", protected),
                  "--adoption-inputs", private_json("inventory.json", inventory),
                  "--identity-routing-values", values,
              ], env)
              command = [
                  "helmfile", "--file", ".helmfile/platform.helmfile.yaml.gotmpl",
                  "--skip-deps", "--state-values-file", values,
              ]
              run([*command, "lint"], env)
              releases = json.loads(run([*command, "list", "--output", "json"], env))
              expected = names | {"postgres", "nats", "litellm-gateway", "keycloak", "ingress", "keycloak-client"}
              if len(releases) != len(expected) or {item["name"] for item in releases} != expected:
                  raise SystemExit("Unexpected platform release graph")
              output = run([*command, "template"], env)
              images = [line.strip().split(":", 1)[1].strip().strip('"')
                        for line in output.splitlines() if line.strip().startswith("image:")]
              if not images or any("@" in image or ":" not in image.rsplit("/", 1)[-1]
                                   or image.lower().endswith(":latest") for image in images):
                  raise SystemExit("Every rendered container must use an explicit image tag")
              for image in inventory["workloadImages"].values():
                  if output.count(f'image: "{image}"\n') != 1:
                      raise SystemExit("Platform workload image pin did not render exactly once")
              if any(line == "kind: Secret" for line in output.splitlines()):
                  raise SystemExit("Protected payload found in platform render")


          if __name__ == "__main__":
              main()
          PYTHON
